name: build-ait

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-ait:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Build Apps in Toss artifact
        run: npx ait build

      - name: Upload Apps in Toss artifact
        uses: actions/upload-artifact@v4
        with:
          name: ait-artifact
          path: |
            **/*.ait
            dist/**
          if-no-files-found: warn
